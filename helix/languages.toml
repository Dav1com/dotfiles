# Only fetch/build these grammars; building all ~245 takes 15+ minutes.
# Names come from `ls ~/.config/helix/runtime/grammars/sources` (or Helix's languages.toml).
# `gitcommit` is left out on purpose: its parser alone takes ~15 minutes to compile.
use-grammars = { only = [
	"bash",
	"c",
	"comment",
	"cpp",
	"css",
	"diff",
	"dockerfile",
	"fish",
	"git-config",
	"git-rebase",
	"gitignore",
	"go",
	"html",
	"java",
	"javascript",
	"jsdoc",
	"json",
	"lua",
	"make",
	"markdown",
	"markdown_inline",
	"python",
	"regex",
	"rust",
	"scala",
	"sql",
	"toml",
	"tsx",
	"typescript",
	"xml",
	"yaml",
] }
